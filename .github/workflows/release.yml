name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  # ── Job 1: Build React frontend ───────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json
      - run: cd web/frontend && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/frontend/dist/

  # ── Job 2: Build binaries (matrix) ────────────────────────────────────────
  build:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            web: false
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            web: false
          - goos: darwin
            goarch: arm64
            suffix: web-darwin-arm64
            web: true
          - goos: darwin
            goarch: amd64
            suffix: web-darwin-amd64
            web: true
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            web: false
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            web: false
          - goos: linux
            goarch: amd64
            suffix: web-linux-amd64
            web: true
          - goos: linux
            goarch: arm64
            suffix: web-linux-arm64
            web: true
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
            web: false
          - goos: windows
            goarch: amd64
            suffix: web-windows-amd64
            ext: .exe
            web: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/download-artifact@v4
        if: matrix.web == true
        with:
          name: frontend-dist
          path: web/frontend/dist/
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"  # strip leading 'v' (v2.0.0 → 2.0.0)
          TAGS=""
          if [ "${{ matrix.web }}" = "true" ]; then TAGS="-tags web"; fi
          EXT="${{ matrix.ext }}"
          go build $TAGS \
            -ldflags "-X github.com/emusal/alogin2/internal/cli.Version=${VERSION} -s -w" \
            -o alogin-${{ matrix.suffix }}${EXT} \
            ./cmd/alogin
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: alogin-${{ matrix.suffix }}${{ matrix.ext }}

  # ── Job 2b: Package sample plugins ───────────────────────────────────────
  package-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create plugins tarball
        run: tar -czf plugins.tar.gz -C testenv plugins
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-tarball
          path: plugins.tar.gz

  # ── Job 2c: Package agent skills ─────────────────────────────────────────
  package-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create skills tarball
        run: tar -czf skills.tar.gz -C skills .
      - uses: actions/upload-artifact@v4
        with:
          name: skills-tarball
          path: skills.tar.gz

  # ── Job 2d: Build macOS .pkg installers ──────────────────────────────────
  build-pkg:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-web-darwin-*
          merge-multiple: true
      - name: Build .pkg (arm64 + amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in arm64 amd64; do
            mkdir -p pkg-root/usr/local/bin
            cp alogin-web-darwin-${ARCH} pkg-root/usr/local/bin/alogin
            chmod +x pkg-root/usr/local/bin/alogin
            pkgbuild \
              --root pkg-root \
              --identifier com.emusal.alogin \
              --version "${VERSION}" \
              --install-location / \
              alogin-${VERSION}-darwin-${ARCH}.pkg
            rm -rf pkg-root
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: "*.pkg"

  # ── Job 2e: Build Windows MSI installers ─────────────────────────────────
  build-msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-web-windows-amd64
      - name: Install WiX Toolset
        shell: powershell
        run: |
          choco install wixtoolset -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI with WiX directly
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp alogin-web-windows-amd64.exe alogin.exe

          # Generate WiX source from wix.wxs template
          cat > alogin.wxs << WXSEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="alogin" Language="1033" Version="${VERSION}"
                     Manufacturer="emusal" UpgradeCode="34cd6e7c-1720-435a-a1aa-fdb0ecc95ade">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="ProductFeature" Title="alogin" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
              </Feature>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLDIR" Name="alogin" />
                </Directory>
              </Directory>
              <ComponentGroup Id="ProductComponents" Directory="INSTALLDIR">
                <Component Id="MainExecutable" Guid="8a7b3c2d-4e5f-6789-abcd-ef0123456789">
                  <File Id="AloginExe" Source="alogin.exe" KeyPath="yes" />
                  <Environment Id="PATH" Name="PATH" Value="[INSTALLDIR]" Permanent="no"
                               Part="last" Action="set" System="yes" />
                </Component>
              </ComponentGroup>
            </Product>
          </Wix>
          WXSEOF

          candle.exe -arch x64 alogin.wxs -o alogin.wixobj
          light.exe alogin.wixobj -o "alogin-${VERSION}-windows-amd64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: msi-windows
          path: "*.msi"

  # ── Job 2f: Build Linux .deb packages ────────────────────────────────────
  build-deb:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-web-linux-*
          merge-multiple: true
      - name: Install nfpm
        run: |
          NFPM_VERSION=$(curl -sSf https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz nfpm
          sudo mv nfpm /usr/local/bin/nfpm
      - name: Build .deb (amd64 + arm64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in amd64 arm64; do
            cp alogin-web-linux-${ARCH} alogin-linux-current
            chmod +x alogin-linux-current
            ARCH=${ARCH} VERSION=${VERSION} nfpm package \
              --config nfpm.yaml \
              --packager deb \
              --target alogin_${VERSION}_${ARCH}.deb
            rm -f alogin-linux-current
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb-linux
          path: "*.deb"
      - name: Update apt repository (gh-pages)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          # gh-pages 브랜치를 worktree로 체크아웃 (없으면 고아 브랜치 생성)
          if git fetch origin gh-pages; then
            git worktree add apt-repo origin/gh-pages
          else
            git worktree add --orphan -b gh-pages apt-repo
          fi

          sudo apt-get install -y reprepro

          # reprepro 설정 (최초 실행 시 구조 생성)
          mkdir -p apt-repo/conf
          cat > apt-repo/conf/distributions << EOF
          Codename: stable
          Components: main
          Architectures: amd64 arm64
          EOF

          # .deb 패키지 추가
          for DEB in *.deb; do
            reprepro -b apt-repo includedeb stable "${DEB}"
          done

          # gh-pages 브랜치에 push
          cd apt-repo
          git add -A
          git commit -m "apt: update repository to v${VERSION}" || echo "No changes"
          git push origin HEAD:gh-pages

  # ── Job 3: Create GitHub Release ──────────────────────────────────────────
  release:
    needs: [build, package-plugins, package-skills, build-pkg, build-msi, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plugins-tarball
      - uses: actions/download-artifact@v4
        with:
          name: skills-tarball
      - uses: actions/download-artifact@v4
        with:
          name: pkg-macos
      - uses: actions/download-artifact@v4
        with:
          name: msi-windows
      - uses: actions/download-artifact@v4
        with:
          name: deb-linux
      - name: Generate checksums
        run: shasum -a 256 alogin-* alogin_* plugins.tar.gz skills.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            alogin-*
            alogin_*
            plugins.tar.gz
            skills.tar.gz
            checksums.txt
          generate_release_notes: true

  # ── Job 4: Update Formula/alogin.rb in this repo ─────────────────────────
  # Uses GITHUB_TOKEN (no extra secret needed).
  # brew tap: brew tap emusal/alogin2 https://github.com/emusal/alogin2
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plugins-tarball
      - name: Generate checksums
        run: shasum -a 256 alogin-* plugins.tar.gz > checksums.txt
      - name: Update Formula/alogin.rb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_DARWIN_ARM64=$(grep 'alogin-web-darwin-arm64' checksums.txt | awk '{print $1}')
          SHA_DARWIN_AMD64=$(grep 'alogin-web-darwin-amd64' checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep  'alogin-web-linux-arm64'  checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep  'alogin-web-linux-amd64'  checksums.txt | awk '{print $1}')
          SHA_PLUGINS=$(grep       'plugins.tar.gz'          checksums.txt | awk '{print $1}')

          cat > Formula/alogin.rb << FORMULA
          class Alogin < Formula
            desc "Modern SSH connection manager with encrypted credential vault"
            homepage "https://github.com/emusal/alogin2"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/emusal/alogin2/releases/download/v${VERSION}/alogin-web-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/emusal/alogin2/releases/download/v${VERSION}/alogin-web-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/emusal/alogin2/releases/download/v${VERSION}/alogin-web-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/emusal/alogin2/releases/download/v${VERSION}/alogin-web-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            resource "plugins" do
              url "https://github.com/emusal/alogin2/releases/download/v${VERSION}/plugins.tar.gz"
              sha256 "${SHA_PLUGINS}"
            end

            def install
              bin.install Dir["alogin-web-*"].first => "alogin"

              plugin_dir = etc/"alogin/plugins"
              plugin_dir.mkpath
              resource("plugins").stage do
                (plugin_dir).install Dir["plugins/*.yaml"]
              end
            end

            def caveats
              <<~EOS
                To set up shell completions, run:
                  alogin completion install            # zsh (default)
                  alogin completion install --shell bash
              EOS
            end

            test do
              assert_match "alogin v${VERSION}", shell_output("#{bin}/alogin version")
            end
          end
          FORMULA
      - name: Commit and push formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/alogin.rb
          git commit -m "brew: update formula to v${VERSION}" || echo "No changes"
          git push origin HEAD:main
